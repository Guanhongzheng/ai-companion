[project]
name = "ai-companion-api"
version = "0.1.0"
description = "个性化多模态 AI 伴侣与社交对话平台 · 后端服务"
requires-python = ">=3.11"
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

# ------------------------------------------------------------
# Ruff —— 代码检查 + 格式化
# ------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", "__pycache__", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

# ------------------------------------------------------------
# Mypy —— 渐进式类型检查
# ------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true
exclude = ["data/", "tests/"]

# ------------------------------------------------------------
# Pytest
# ------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
